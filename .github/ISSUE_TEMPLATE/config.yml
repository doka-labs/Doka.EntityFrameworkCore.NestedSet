# Route public reports through the forms matching the supported NestedSet contracts.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability privately
    url: https://github.com/doka-labs/Doka.EntityFrameworkCore.NestedSet/security/policy
    about: Do not disclose vulnerabilities or sensitive data in a public issue.
  - name: Read the support and qualification policy
    url: https://github.com/doka-labs/Doka.EntityFrameworkCore.NestedSet/blob/main/SUPPORT.md
    about: Check supported packages, providers, required evidence, and routing before opening an issue.
