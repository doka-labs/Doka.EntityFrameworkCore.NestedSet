version: 2
updates:
  - package-ecosystem: dotnet-sdk
    target-branch: main
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: docker
    target-branch: main
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # WHY: Qualification owns the MySQL 8.4 and MariaDB 11.8 LTS lines;
      # automatic proposals may update their patches, but must not replace them.
      - dependency-name: mysql
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: mariadb
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # WHY: PostgreSQL maintenance releases change the second version number,
      # so minor updates within the qualified major must remain eligible.
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
  - package-ecosystem: nuget
    target-branch: main
    directory: /
    schedule:
      interval: weekly
    groups:
      doka:
        # WHY: The MySQL adapter requires a matching provider release; qualify the Doka packages together.
        patterns:
          - Doka.EntityFrameworkCore.MySql
          - Doka.EntityFrameworkCore.SafeMigrations.*
      entity-framework:
        patterns:
          - Microsoft.EntityFrameworkCore
          - Microsoft.EntityFrameworkCore.*
      xunit:
        patterns:
          - xunit.*
      testcontainers:
        patterns:
          - Testcontainers.*
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore"
        versions: [">=11.0.0-0", ">=11.0.0--"]
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        versions: [">=11.0.0-0", ">=11.0.0--"]
      - dependency-name: "Doka.EntityFrameworkCore.MySql"
        versions: [">=11.0.0-0", ">=11.0.0--"]
      - dependency-name: "Doka.EntityFrameworkCore.SafeMigrations"
        versions: [">=11.0.0-0", ">=11.0.0--"]
      - dependency-name: "Doka.EntityFrameworkCore.SafeMigrations.*"
        versions: [">=11.0.0-0", ">=11.0.0--"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        versions: [">=11.0.0-0", ">=11.0.0--"]
      - dependency-name: "Microsoft.Extensions.*"
        versions: [">=11.0.0-0", ">=11.0.0--"]
  - package-ecosystem: github-actions
    target-branch: main
    directory: /
    schedule:
      interval: weekly
