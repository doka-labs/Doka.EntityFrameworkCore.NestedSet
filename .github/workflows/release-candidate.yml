name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed exact version (X.Y.Z-rc.N or X.Y.Z), without v.
        required: true
        type: string
      qualification-only:
        description: Qualify the selected line without publication or its environment.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nestedset-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false
  queue: max

env:
  CANDIDATE_VERSION: ${{ inputs.version }}

jobs:
  preflight:
    name: Verify source and unused version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      line-json: ${{ steps.preflight.outputs.line-json }}
      publish-allowed: ${{ steps.preflight.outputs.publish-allowed }}
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact dispatch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject stale source, existing tag, and used package version
        id: preflight
        env:
          QUALIFICATION_ONLY: ${{ inputs.qualification-only }}
        run: |
          qualification=()
          if [[ "$QUALIFICATION_ONLY" == true ]]; then
            qualification=(--qualification-only)
          fi

          python3 -m eng.release.publication preflight \
            --version "$CANDIDATE_VERSION" "${qualification[@]}" --output artifacts/preflight.json
          {
            echo "line-json=$(jq -c '.line' artifacts/preflight.json)"
            echo "publish-allowed=$(jq -r '.publishAllowed' artifacts/preflight.json)"
          } >> "$GITHUB_OUTPUT"

  qualification:
    name: Qualification
    needs: preflight
    uses: ./.github/workflows/quality-gates.yml
    permissions:
      contents: read
    with:
      package-version: ${{ inputs.version }}
      release-line: ${{ needs.preflight.outputs.line-json }}

  qualify:
    name: Qualify exact release candidate
    needs: [preflight, qualification]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NESTEDSET_RELEASE_LINE: ${{ needs.preflight.outputs.line-json }}
      PACKAGE_ARTIFACT_ID: ${{ needs.qualification.outputs.package-artifact-id }}
      CONSUMER_ARTIFACT_ID: ${{ needs.qualification.outputs.consumer-artifact-id }}
      SBOM_ARTIFACT_ID: ${{ needs.qualification.outputs.sbom-artifact-id }}
    outputs:
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
      publish-allowed: ${{ needs.preflight.outputs.publish-allowed }}

    steps:
      - name: Require every qualification job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: >-
          jq -e 'length == 2 and all(.[]; .result == "success")' <<< "$JOB_RESULTS"

      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact producer artifact IDs
        run: |
          for artifact_id in "$PACKAGE_ARTIFACT_ID" "$CONSUMER_ARTIFACT_ID" "$SBOM_ARTIFACT_ID"; do
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          done

      - name: Download exact packages and build evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.qualification.outputs.package-artifact-id }}
          path: artifacts/qualification

      - name: Download consumer evidence from its successful job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.qualification.outputs.consumer-artifact-id }}
          path: artifacts/qualification/consumer

      - name: Download SBOM evidence from its successful job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.qualification.outputs.sbom-artifact-id }}
          path: artifacts/qualification/sbom

      - name: Download current-attempt test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tests-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/qualification/tests

      - name: Verify complete evidence and seal exact candidate
        run: >-
          python3 -m eng.release.qualification --job seal
          --version "$CANDIDATE_VERSION" --output artifacts/qualification

      - name: Retain qualification and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/qualification/identity.json
            artifacts/qualification/operator-summary.md
            artifacts/qualification/logs
            artifacts/qualification/quality
            artifacts/qualification/tests/results.json
            artifacts/qualification/packages/package-manifest.json
            artifacts/qualification/consumer
            artifacts/qualification/sbom
          if-no-files-found: warn
          retention-days: 30

      - name: Retain exact complete candidate
        id: candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/qualification/candidate
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Sign and verify candidate provenance
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Checkout verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download this run's exact qualified candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts/candidate

      - name: Verify complete candidate inventory
        run: python3 -c 'from eng.release.common import load_candidate; load_candidate("artifacts/candidate")'

      - name: Attest manifest and primary and symbol packages
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/candidate/candidate.json
            artifacts/candidate/*.nupkg
            artifacts/candidate/*.snupkg

      - name: Attest Core SBOM
        id: core-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/candidate/Doka.NestedSet.${{ inputs.version }}.nupkg
          sbom-path: artifacts/candidate/Doka.NestedSet.spdx.json

      - name: Attest EF Core SBOM
        id: ef-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/candidate/Doka.EntityFrameworkCore.NestedSet.${{ inputs.version }}.nupkg
          sbom-path: artifacts/candidate/Doka.EntityFrameworkCore.NestedSet.spdx.json

      - name: Attest MySQL adapter SBOM
        id: mysql-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/candidate/Doka.EntityFrameworkCore.NestedSet.MySql.${{ inputs.version }}.nupkg
          sbom-path: artifacts/candidate/Doka.EntityFrameworkCore.NestedSet.MySql.spdx.json

      - name: Attest PostgreSQL adapter SBOM
        id: postgres-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/candidate/Doka.EntityFrameworkCore.NestedSet.Postgres.${{ inputs.version }}.nupkg
          sbom-path: artifacts/candidate/Doka.EntityFrameworkCore.NestedSet.Postgres.spdx.json

      - name: Attest SQLite adapter SBOM
        id: sqlite-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/candidate/Doka.EntityFrameworkCore.NestedSet.Sqlite.${{ inputs.version }}.nupkg
          sbom-path: artifacts/candidate/Doka.EntityFrameworkCore.NestedSet.Sqlite.spdx.json

      - name: Attest SQL Server adapter SBOM
        id: sqlserver-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/candidate/Doka.EntityFrameworkCore.NestedSet.SqlServer.${{ inputs.version }}.nupkg
          sbom-path: artifacts/candidate/Doka.EntityFrameworkCore.NestedSet.SqlServer.spdx.json

      - name: Materialize and verify portable signed bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          CORE_BUNDLE: ${{ steps.core-sbom.outputs.bundle-path }}
          EF_BUNDLE: ${{ steps.ef-sbom.outputs.bundle-path }}
          MYSQL_BUNDLE: ${{ steps.mysql-sbom.outputs.bundle-path }}
          POSTGRES_BUNDLE: ${{ steps.postgres-sbom.outputs.bundle-path }}
          SQLITE_BUNDLE: ${{ steps.sqlite-sbom.outputs.bundle-path }}
          SQLSERVER_BUNDLE: ${{ steps.sqlserver-sbom.outputs.bundle-path }}
        shell: bash
        run: |
          mkdir -p artifacts/provenance
          cp "$PROVENANCE_BUNDLE" artifacts/provenance/release-provenance.jsonl
          cp "$CORE_BUNDLE" artifacts/provenance/sbom-Doka.NestedSet.jsonl
          cp "$EF_BUNDLE" artifacts/provenance/sbom-Doka.EntityFrameworkCore.NestedSet.jsonl
          cp "$MYSQL_BUNDLE" artifacts/provenance/sbom-Doka.EntityFrameworkCore.NestedSet.MySql.jsonl
          cp "$POSTGRES_BUNDLE" artifacts/provenance/sbom-Doka.EntityFrameworkCore.NestedSet.Postgres.jsonl
          cp "$SQLITE_BUNDLE" artifacts/provenance/sbom-Doka.EntityFrameworkCore.NestedSet.Sqlite.jsonl
          cp "$SQLSERVER_BUNDLE" artifacts/provenance/sbom-Doka.EntityFrameworkCore.NestedSet.SqlServer.jsonl
          python3 -m eng.release.publication attest-verify \
            --candidate artifacts/candidate \
            --provenance artifacts/provenance

      - name: Retain exact provenance artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/provenance
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish approved candidate
    needs: [qualify, attest]
    if: ${{ !inputs.qualification-only && needs.qualify.outputs.publish-allowed == 'true' }}
    # WHY: Every version and source line shares one publisher; lower or late patches cannot race Latest.
    concurrency:
      group: nestedset-publication
      cancel-in-progress: false
      queue: max
    environment: nuget
    runs-on: ubuntu-24.04
    # WHY: NuGet package and symbol indexing has exceeded an hour in actual releases; readback needs its full budget.
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
      attestations: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      NESTEDSET_PUBLICATION_LOCK_GROUP: nestedset-publication
      NESTEDSET_PUBLICATION_LOCK_HELD: '1'

    steps:
      - name: Checkout qualified source and signed tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET for package verification and publication
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download original candidate by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts/candidate

      - name: Download original provenance by immutable artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.attest.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts/provenance

      - name: Revalidate source and operator-signed tag
        shell: bash
        run: |
          git fetch --no-tags origin "$GITHUB_REF:refs/remotes/origin/${GITHUB_REF#refs/heads/}"
          git fetch --no-tags origin "refs/tags/v$CANDIDATE_VERSION:refs/tags/v$CANDIDATE_VERSION"
          python3 -m eng.release.publication authorize \
            --candidate artifacts/candidate \
            --provenance artifacts/provenance \
            --output artifacts/publication/authorization.json

      - name: Reject conflicting public package bytes
        shell: bash
        run: |
          mkdir -p artifacts/packages artifacts/publication
          cp artifacts/candidate/*.nupkg artifacts/candidate/*.snupkg artifacts/packages/
          python3 -m eng.release.nuget availability \
            --package-dir artifacts/packages \
            --version "$CANDIDATE_VERSION" \
            --manifest artifacts/candidate/package-manifest.json \
            --output artifacts/publication/availability.json

      - name: Stage complete matching draft before credentials
        run: >-
          python3 -m eng.release.publication stage
          --candidate artifacts/candidate
          --provenance artifacts/provenance
          --output artifacts/publication/draft.json

      - name: Recheck current line permission before credentials
        run: >-
          python3 -m eng.release.publication recheck
          --candidate artifacts/candidate --provenance artifacts/provenance
          --authorization artifacts/publication/authorization.json

      - name: Obtain short-lived NuGet credential
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # WHY: Manifest order places dependencies before adapters; every primary must precede every symbol upload.
      - name: Publish primary packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          packages="$(jq -er '[.packages[].nupkg] |
            if length > 0 and all(.[]; type == "string" and length > 0)
            then .[] else error("Missing primary package filenames") end' artifacts/candidate/package-manifest.json)"
          while IFS= read -r package; do
            echo "::group::Publish $package"
            python3 -m eng.release.publication recheck \
              --candidate artifacts/candidate --provenance artifacts/provenance \
              --authorization artifacts/publication/authorization.json
            dotnet nuget push "artifacts/candidate/$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --no-symbols --skip-duplicate --timeout 300
            echo "::endgroup::"
          done <<< "$packages"

      - name: Publish symbol packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          packages="$(jq -er '[.packages[].snupkg] |
            if length > 0 and all(.[]; type == "string" and length > 0)
            then .[] else error("Missing symbol package filenames") end' artifacts/candidate/package-manifest.json)"
          while IFS= read -r package; do
            echo "::group::Publish $package"
            python3 -m eng.release.publication recheck \
              --candidate artifacts/candidate --provenance artifacts/provenance \
              --authorization artifacts/publication/authorization.json
            dotnet nuget push "artifacts/candidate/$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate --timeout 300
            echo "::endgroup::"
          done <<< "$packages"

      - name: Verify signed public packages and indexed Portable PDBs
        run: >-
          python3 -m eng.release.nuget readback
          --package-dir artifacts/packages
          --version "$CANDIDATE_VERSION"
          --manifest artifacts/candidate/package-manifest.json
          --output artifacts/publication/nuget-readback.json
          --timeout-seconds 7200

      - name: Publish and verify immutable GitHub release
        run: >-
          python3 -m eng.release.publication publish-release
          --candidate artifacts/candidate
          --provenance artifacts/provenance
          --readback artifacts/publication/nuget-readback.json
          --output artifacts/publication/release.json

      - name: Record complete public readback
        run: >-
          python3 -m eng.release.publication complete
          --candidate artifacts/candidate
          --provenance artifacts/provenance
          --readback artifacts/publication/nuget-readback.json
          --output artifacts/publication/completion.json

      - name: Retain completion or interrupted publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/publication
          if-no-files-found: error
          retention-days: 30
