name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Source, build, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 130

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Check offline engineering regressions
        shell: bash
        run: |
          python3 -m unittest discover -s eng/tests -p 'test_*.py'
          python3 -m unittest discover -s eng/ci-tests -p 'test_*.py'

      - name: Restore locked dependencies
        id: restore
        run: dotnet restore Doka.EntityFrameworkCore.NestedSet.slnx --locked-mode

      - name: Check C# style and unused imports
        shell: bash
        run: |
          dotnet format Doka.EntityFrameworkCore.NestedSet.slnx style --severity warn --verify-no-changes --no-restore
          dotnet format Doka.EntityFrameworkCore.NestedSet.slnx style --diagnostics IDE0005 --severity hidden --verify-no-changes --no-restore

      - name: Build Release solution
        run: dotnet build Doka.EntityFrameworkCore.NestedSet.slnx --configuration Release --no-restore

      - name: Run all C# tests
        env:
          DOKA_NESTEDSET_QUERY_PLAN_DIR: ${{ github.workspace }}/artifacts/ci-tests/query-plans
        shell: bash
        run: |
          docker info
          dotnet test Doka.EntityFrameworkCore.NestedSet.slnx --configuration Release --no-build --no-restore -m:1 \
            --settings eng/coverage.runsettings --collect:"Code Coverage" --logger trx \
            --results-directory artifacts/ci-tests

      - name: Verify coverage reports
        run: python3 eng/verify-coverage.py artifacts/ci-tests

      - name: Run SQLite samples
        env:
          NESTEDSET_SAMPLE_SQLITE_DIRECTORY: ${{ github.workspace }}/artifacts/ci-tests/sample-data
        shell: bash
        run: |
          for sample in FileSystem Kpis UserGroups; do
            dotnet run --project "samples/$sample" --configuration Release --no-build --no-restore \
              -- --provider sqlite --reset
          done

      - name: Pack shipping projects
        run: >-
          dotnet pack Doka.EntityFrameworkCore.NestedSet.slnx
          --configuration Release --no-build --no-restore
          --output artifacts/ci-packages

      - name: Prepare failed Dependabot lockfile diagnostic
        id: dependabot-diagnostic
        if: failure() && steps.restore.outcome == 'failure' && github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        run: >-
          python3 eng/prepare-lockfile-patch.py
          --solution Doka.EntityFrameworkCore.NestedSet.slnx
          --output artifacts/dependabot-lockfiles.patch

      - name: Retain Dependabot lockfile diagnostic
        if: always() && steps.dependabot-diagnostic.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-lockfile-patch-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dependabot-lockfiles.patch
          if-no-files-found: error
          retention-days: 14

      - name: Retain test and coverage reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-tests
          if-no-files-found: warn
          retention-days: 30

  repository-qualification:
    name: Repository qualification
    if: always()
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Require complete qualification
        env:
          QUALIFICATION_RESULT: ${{ needs.qualify.result }}
        run: test "$QUALIFICATION_RESULT" = success
