name: CI
run-name: ${{ inputs.maintenance && format('maintenance {0}', inputs.schedule-correlation) || github.event.pull_request.title || github.event.head_commit.message || 'CI' }}

on:
  pull_request:
    branches: [main, 'maintenance/**', 'preview/**']
  workflow_dispatch:
    inputs:
      maintenance:
        description: Execute this branch's qualification after exact coordinator dispatch.
        type: boolean
        default: false
      schedule-correlation:
        description: Coordinator run and attempt identity.
        type: string
        default: ''
      schedule-source-sha:
        description: Exact protected branch head frozen by the coordinator.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}-${{ inputs.maintenance && inputs.schedule-correlation || 'normal' }}
  cancel-in-progress: true

jobs:
  schedule-identity:
    name: schedule-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout branch-native guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the exact scheduled source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_MAINTENANCE: ${{ inputs.maintenance || false }}
          INPUT_CORRELATION: ${{ inputs.schedule-correlation }}
          INPUT_SOURCE_SHA: ${{ inputs.schedule-source-sha }}
        run: python3 -m eng.release.maintenance guard --workflow ci.yml

      - name: Validate the registered pull request base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m eng.release.maintenance check-pr

  qualification:
    name: Qualification
    needs: schedule-identity
    uses: ./.github/workflows/quality-gates.yml
    permissions:
      contents: read

  repository-qualification:
    name: Repository qualification
    if: always()
    needs: [schedule-identity, qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Require every qualification job to succeed
        env:
          RESULTS: >-
            schedule-identity=${{ needs.schedule-identity.result }}
            qualification=${{ needs.qualification.result }}
        run: |
          status=0
          printf '| Check | Result |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          for entry in ${RESULTS}; do
            job="${entry%%=*}"
            result="${entry#*=}"
            printf '| %s | %s |\n' "$job" "$result" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" != success ]]; then
              echo "::error title=Repository qualification::${job} concluded '${result}'."
              status=1
            fi
          done

          exit "$status"
