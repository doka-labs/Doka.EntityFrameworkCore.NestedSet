name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    name: C# style and unused imports
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore Doka.EntityFrameworkCore.NestedSet.slnx --locked-mode

      - name: Check C# style
        run: dotnet format Doka.EntityFrameworkCore.NestedSet.slnx style --severity warn --verify-no-changes --no-restore

      - name: Check unused imports
        run: dotnet format Doka.EntityFrameworkCore.NestedSet.slnx style --diagnostics IDE0005 --severity hidden --verify-no-changes --no-restore

  engineering-tests:
    name: Engineering regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run release engineering regressions
        run: python3 -m unittest discover -s eng/tests -p 'test_*.py'

      - name: Run Dependabot diagnostic regressions
        run: python3 -m unittest discover -s eng/ci-tests -p 'test_*.py'

  build:
    name: Release build and NuGet packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        id: restore
        run: dotnet restore Doka.EntityFrameworkCore.NestedSet.slnx --locked-mode

      - name: Build Release solution
        run: dotnet build Doka.EntityFrameworkCore.NestedSet.slnx --configuration Release --no-restore

      - name: Pack shipping projects
        run: >-
          dotnet pack Doka.EntityFrameworkCore.NestedSet.slnx
          --configuration Release --no-build --no-restore
          --output artifacts/ci-packages

      - name: Inspect primary and symbol packages
        shell: bash
        run: |
          package_version="$(dotnet msbuild src/Doka.NestedSet/Doka.NestedSet.csproj -nologo -getProperty:PackageVersion)"
          python3 -m eng.release.packages \
            --package-dir artifacts/ci-packages \
            --version "$package_version" \
            --source-commit "$(git rev-parse HEAD)" \
            --output artifacts/ci-package-manifest.json

      - name: Retain NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci-packages
            artifacts/ci-package-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Prepare failed Dependabot lockfile diagnostic
        id: dependabot-diagnostic
        if: failure() && steps.restore.outcome == 'failure' && github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        run: >-
          python3 eng/prepare-lockfile-patch.py
          --solution Doka.EntityFrameworkCore.NestedSet.slnx
          --output artifacts/dependabot-lockfiles.patch

      - name: Retain Dependabot lockfile diagnostic
        if: always() && steps.dependabot-diagnostic.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-lockfile-patch-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dependabot-lockfiles.patch
          if-no-files-found: error
          retention-days: 14

  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 130

    # WHY: Separate runners isolate Docker resources and coverage-instrumented
    # outputs. Each lane builds its own project graph without a binary handoff.
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: core
            name: Core unit tests
            project: tests/Doka.NestedSet.Tests/Doka.NestedSet.Tests.csproj
            docker: false
          - id: ef-unit
            name: EF Core unit tests
            project: tests/Doka.EntityFrameworkCore.NestedSet.Unit.Tests/Doka.EntityFrameworkCore.NestedSet.Unit.Tests.csproj
            docker: false
          - id: benchmark-contracts
            name: Benchmark contract tests
            project: tests/Doka.EntityFrameworkCore.NestedSet.Benchmarks.Tests/Doka.EntityFrameworkCore.NestedSet.Benchmarks.Tests.csproj
            docker: false
          - id: mysql
            name: MySQL and MariaDB integration tests
            project: tests/Doka.EntityFrameworkCore.NestedSet.MySql.Tests/Doka.EntityFrameworkCore.NestedSet.MySql.Tests.csproj
            docker: true
          - id: postgresql
            name: PostgreSQL integration tests
            project: tests/Doka.EntityFrameworkCore.NestedSet.PostgreSql.Tests/Doka.EntityFrameworkCore.NestedSet.PostgreSql.Tests.csproj
            docker: true
          - id: sqlserver
            name: SQL Server integration tests
            project: tests/Doka.EntityFrameworkCore.NestedSet.SqlServer.Tests/Doka.EntityFrameworkCore.NestedSet.SqlServer.Tests.csproj
            docker: true
          - id: sqlite
            name: SQLite integration tests
            project: tests/Doka.EntityFrameworkCore.NestedSet.Sqlite.Tests/Doka.EntityFrameworkCore.NestedSet.Sqlite.Tests.csproj
            docker: false
          - id: migrations
            name: EF migration integration tests
            project: tests/Doka.EntityFrameworkCore.NestedSet.Migrations.Tests/Doka.EntityFrameworkCore.NestedSet.Migrations.Tests.csproj
            docker: true
          - id: safe-migrations
            name: SafeMigrations integration tests
            project: tests/Doka.EntityFrameworkCore.NestedSet.SafeMigrations.Tests/Doka.EntityFrameworkCore.NestedSet.SafeMigrations.Tests.csproj
            docker: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked test dependencies
        run: dotnet restore "${{ matrix.project }}" --locked-mode

      - name: Build test project
        run: dotnet build "${{ matrix.project }}" --configuration Release --no-restore

      - name: Check Docker availability
        if: matrix.docker
        run: docker info

      - name: Run tests with coverage
        env:
          DOKA_NESTEDSET_QUERY_PLAN_DIR: ${{ github.workspace }}/artifacts/ci-tests/${{ matrix.id }}/query-plans
        run: >-
          dotnet test "${{ matrix.project }}" --configuration Release --no-build --no-restore
          --settings eng/coverage.runsettings --collect:"Code Coverage" --logger trx
          --results-directory artifacts/ci-tests/${{ matrix.id }}

      - name: Require this project's coverage report
        run: test -n "$(find artifacts/ci-tests/${{ matrix.id }} -type f -name '*.cobertura.xml' -print -quit)"

      - name: Retain test, coverage, and query-plan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-tests-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-tests/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 30

  samples:
    name: SQLite sample / ${{ matrix.sample }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        sample: [FileSystem, Kpis, UserGroups]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked sample dependencies
        run: dotnet restore "samples/${{ matrix.sample }}" --locked-mode

      - name: Build sample
        run: dotnet build "samples/${{ matrix.sample }}" --configuration Release --no-restore

      - name: Run sample
        env:
          NESTEDSET_SAMPLE_SQLITE_DIRECTORY: ${{ github.workspace }}/artifacts/sample-data
        run: >-
          dotnet run --project "samples/${{ matrix.sample }}" --configuration Release --no-build --no-restore
          -- --provider sqlite --reset

  coverage:
    name: Coverage reports
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all test reports from this attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-tests-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-tests

      - name: Verify coverage across all test projects
        run: python3 eng/verify-coverage.py artifacts/ci-tests

  repository-qualification:
    name: Repository qualification
    if: always()
    needs: [source-quality, engineering-tests, build, tests, samples, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Require every qualification job to succeed
        env:
          RESULTS: >-
            source-quality=${{ needs.source-quality.result }}
            engineering-tests=${{ needs.engineering-tests.result }}
            build=${{ needs.build.result }}
            tests=${{ needs.tests.result }}
            samples=${{ needs.samples.result }}
            coverage=${{ needs.coverage.result }}
        run: |
          status=0
          printf '| Check | Result |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          for entry in ${RESULTS}; do
            job="${entry%%=*}"
            result="${entry#*=}"
            printf '| %s | %s |\n' "$job" "$result" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" != success ]]; then
              echo "::error title=Repository qualification::${job} concluded '${result}'."
              status=1
            fi
          done

          exit "$status"
